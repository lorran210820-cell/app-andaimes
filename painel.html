<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Encarregados</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Painel de Acompanhamento Diário</h1>
            <a href="index.html" class="bg-slate-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700">Voltar ao App Mobile</a>
        </div>

        <!-- Grid de Cards (Estilo Comanda) -->
        <div id="gridCards" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Os cards entram aqui via JavaScript -->
        </div>
    </div>

    <script>
        const grid = document.getElementById('gridCards');
        const dados = JSON.parse(localStorage.getItem('apontamentos')) || [];

        if (dados.length === 0) {
            grid.innerHTML = `<p class="text-slate-500 col-span-3 text-center py-10">Nenhum apontamento recebido hoje.</p>`;
        } else {
            grid.innerHTML = '';
            dados.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-md border-l-4 border-green-500">
                        <h3 class="font-bold text-lg text-slate-800">${item.encarregado}</h3>
                        <p class="text-sm text-slate-600"><strong>Local:</strong> ${item.local}</p>
                        <p class="text-sm text-slate-600"><strong>Ação:</strong> ${item.tipo}</p>
                        <div class="mt-3 pt-3 border-t text-xs text-slate-500 flex justify-between">
                            <span>Efetivo: ${item.pessoas}</span>
                            <span>Faltas: ${item.faltas}</span>
                            <span>Data: ${item.data}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
