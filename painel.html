<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Encarregados</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-6">
    
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4 bg-white p-4 rounded-lg shadow-sm gap-4">
        <div class="flex items-center gap-4">
            <img src="Logo.png" alt="Logo da Empresa" class="h-16 object-contain">
            <h1 class="text-2xl font-bold text-slate-800">Painel de Acompanhamento</h1>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-50 border p-2 rounded-lg">
                <label for="filtroData" class="text-xs font-semibold text-slate-600">Filtrar Data:</label>
                <input type="date" id="filtroData" class="bg-white border rounded px-2 py-1 text-sm font-medium text-slate-800" onchange="carregarCards()">
            </div>
            <button onclick="exportarExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-green-700 flex items-center gap-2 transition">
                Exportar Excel (CSV)
            </button>
        </div>
    </div>

    <div id="gridCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto relative shadow-2xl">
            <button onclick="fecharModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
            <div id="modalConteudo" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const hojeIso = new Date().toISOString().split('T')[0];
        document.getElementById('filtroData').value = hojeIso;

        // Função de cálculo de peso aproximado
        function calcularPesoAproximado(materiaisLista) {
            if (!materiaisLista || materiaisLista.length === 0) return 0;
            
            let pesoTotal = 0;
            materiaisLista.forEach(item => {
                const nome = item.nome.toLowerCase();
                const qtd = parseInt(item.quantidade) || 0;

                if (nome.includes('tubo')) {
                    // Extrai os metros do nome (ex: "Tubo 1,50m" vira 1.50)
                    const matchMetros = item.nome.match(/(\d+,\d+|\d+)/);
                    if (matchMetros) {
                        const metros = parseFloat(matchMetros[0].replace(',', '.'));
                        // 3,40 kg por metro por tubo
                        const pesoTubo = metros * 3.40;
                        pesoTotal += pesoTubo * qtd;
                    }
                } else {
                    // Demais itens (braçadeiras, sapatas, pranchas, escadas, etc.) consideram 0,90 kg cada
                    pesoTotal += 0.90 * qtd;
                }
            });
            return pesoTotal;
        }

        function carregarCards() {
            const grid = document.getElementById('gridCards');
            const dataSelecionada = document.getElementById('filtroData').value; 
            const dados = JSON.parse(localStorage.getItem('apontamentos')) || [];
            
            const dadosFiltrados = dados.filter(d => {
                if (d.dataIso) return d.dataIso === dataSelecionada;
                return true; 
            });

            if (dadosFiltrados.length === 0) {
                grid.innerHTML = `<p class="text-slate-500 col-span-full text-center py-20 bg-white rounded-xl shadow">Nenhum apontamento encontrado para a data selecionada.</p>`;
                return;
            }

            grid.innerHTML = '';
            dadosFiltrados.sort((a,b) => (b.id || 0) - (a.id || 0));

            dadosFiltrados.forEach(item => {
                const corBorda = item.tipo === 'Montagem' ? 'border-blue-500' : 'border-orange-500';
                const iconeFoto = (item.fotoAntes || item.fotoDepois) ? '📷' : '';
                const pesoCalc = calcularPesoAproximado(item.materiaisLista);

                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-md border-t-4 ${corBorda} hover:shadow-xl transition cursor-pointer flex flex-col justify-between" onclick="abrirDetalhes(${item.id})">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-base text-slate-900 leading-tight">${item.encarregado} ${iconeFoto}</h3>
                                <span class="text-xs px-2 py-1 rounded font-semibold ${item.tipo === 'Montagem' ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'}">${item.tipo}</span>
                            </div>
                            <p class="text-xs text-slate-500 mb-1"><strong>Local:</strong> ${item.local}</p>
                            <p class="text-xs text-slate-700 font-medium mb-3 line-clamp-2"><strong>Atividade:</strong> ${item.atividade}</p>
                        </div>
                        <div>
                            <div class="bg-slate-50 p-2 rounded mb-2 text-xs flex justify-between items-center border">
                                <span class="text-slate-600">Peso Aproximado:</span>
                                <span class="font-bold text-blue-700">${pesoCalc.toFixed(2)} kg</span>
                            </div>
                            <div class="pt-2 border-t text-xs text-slate-500 flex justify-between items-center">
                                <span>👥 Pessoas: <strong>${item.pessoas}</strong> | Faltas: <strong>${item.faltas}</strong></span>
                                <span class="text-slate-400">${item.hora || ''}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirDetalhes(id) {
            const dados = JSON.parse(localStorage.getItem('apontamentos')) || [];
            const item = dados.find(d => d.id === id);
            if (!item) return;

            const pesoCalc = calcularPesoAproximado(item.materiaisLista);

            let htmlMateriais = '<span class="text-slate-400 text-sm">Nenhum material registrado.</span>';
            if (item.materiaisLista && item.materiaisLista.length > 0) {
                htmlMateriais = '<ul class="list-disc pl-5 text-sm space-y-1">';
                item.materiaisLista.forEach(m => {
                    htmlMateriais += `<li><strong>${m.quantidade}x</strong> ${m.nome}</li>`;
                });
                htmlMateriais += '</ul>';
            }

            const divFotoAntes = item.fotoAntes 
                ? `<a href="${item.fotoAntes}" target="_blank"><img src="${item.fotoAntes}" class="w-full h-40 object-cover rounded-lg border shadow-sm hover:opacity-80 transition cursor-zoom-in"></a>` 
                : `<div class="w-full h-40 bg-slate-100 flex items-center justify-center rounded-lg border text-slate-400 text-xs">Sem foto</div>`;

            const divFotoDepois = item.fotoDepois 
                ? `<a href="${item.fotoDepois}" target="_blank"><img src="${item.fotoDepois}" class="w-full h-40 object-cover rounded-lg border shadow-sm hover:opacity-80 transition cursor-zoom-in"></a>` 
                : `<div class="w-full h-40 bg-slate-100 flex items-center justify-center rounded-lg border text-slate-400 text-xs">Sem foto</div>`;

            modalConteudo.innerHTML = `
                <h2 class="text-xl font-bold text-slate-800 border-b pb-2">${item.encarregado}</h2>
                
                <div class="grid grid-cols-2 gap-4 text-sm text-slate-700 bg-slate-50 p-3 rounded-lg">
                    <p><strong>Data:</strong> ${item.data}</p>
                    <p><strong>Hora:</strong> ${item.hora || 'N/A'}</p>
                    <p><strong>Tipo:</strong> ${item.tipo}</p>
                    <p><strong>Local:</strong> ${item.local}</p>
                </div>
                
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Atividade Realizada</p>
                    <p class="text-sm font-medium text-slate-800 bg-white border p-2 rounded mt-1">${item.atividade}</p>
                </div>
                
                <div class="grid grid-cols-3 gap-2 text-center text-sm">
                    <div class="bg-blue-50 p-2 rounded border">Pessoas: <strong>${item.pessoas}</strong></div>
                    <div class="bg-red-50 p-2 rounded border">Faltas: <strong>${item.faltas}</strong></div>
                    <div class="bg-amber-50 p-2 rounded border">Folgas/CT: <strong>${item.folgas}</strong></div>
                </div>

                <!-- Destaque do Peso Calculado -->
                <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg flex justify-between items-center">
                    <span class="text-xs font-bold text-blue-900 uppercase">Peso Total Estimado do Andaime:</span>
                    <span class="text-lg font-extrabold text-blue-700">${pesoCalc.toFixed(2)} kg</span>
                </div>
                
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase mb-1">Materiais Utilizados</p>
                    <div class="bg-slate-50 border p-2 rounded">${htmlMateriais}</div>
                </div>

                <div class="mt-4 pt-4 border-t">
                    <p class="text-xs font-semibold text-slate-500 uppercase mb-2">Evidências Fotográficas</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-center text-xs text-slate-600 mb-1 font-semibold">Antes</p>
                            ${divFotoAntes}
                        </div>
                        <div>
                            <p class="text-center text-xs text-slate-600 mb-1 font-semibold">Depois</p>
                            ${divFotoDepois}
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fecharModal() {
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function exportarExcel() {
            const dados = JSON.parse(localStorage.getItem('apontamentos')) || [];
            if (dados.length === 0) {
                alert('Não há dados para exportar.');
                return;
            }

            let csv = 'ID;Data;Hora;Encarregado;Local;Tipo;Atividade;Pessoas;Faltas;Folgas;Peso Estimado (kg);Materiais\n';
            dados.forEach(d => {
                const pesoCalc = calcularPesoAproximado(d.materiaisLista);
                let matsTexto = '';
                if (d.materiaisLista) {
                    matsTexto = d.materiaisLista.map(m => `${m.quantidade}x ${m.nome}`).join(' | ');
                }

                csv += `"${d.id}","${d.data}","${d.hora || ''}","${d.encarregado}","${d.local}","${d.tipo}","${d.atividade}","${d.pessoas}","${d.faltas}","${d.folgas}","${pesoCalc.toFixed(2)}","${matsTexto}"\n`;
            });

            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `apontamentos_andaimes_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        carregarCards();
    </script>
</body>
</html>
