<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Encarregados</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-6">
    
    <!-- Logo da Empresa -->
    <div class="flex justify-between items-center mb-8 border-b pb-4 bg-white p-4 rounded-lg shadow-sm">
        <img src="Logo.png" alt="Logo da Empresa" class="h-16 object-contain">
        <h1 class="text-2xl font-bold text-slate-800">Painel de Acompanhamento Diário</h1>
        <div class="flex gap-2">
            <button onclick="exportarExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M12 13h4"/><path d="M12 17h4"/></svg>
                Exportar Excel (CSV)
            </button>
            <a href="index.html" class="bg-slate-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700">Voltar ao App</a>
        </div>
    </div>

    <!-- Grid de Cards (Estilo Comanda) -->
    <div id="gridCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Os cards entram aqui via JavaScript -->
    </div>

    <!-- Modal de Detalhes (Escondido) -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div id="modalConteudo" class="space-y-4">
                <!-- Detalhes do apontamento vão aqui -->
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('gridCards');
        const modal = document.getElementById('modal');
        const modalConteudo = document.getElementById('modalConteudo');
        
        // Carrega dados do dia atual (filtra por data para não acumular dias antigos no grid principal)
        const hoje = new Date().toLocaleDateString('pt-BR');
        const dados = JSON.parse(localStorage.getItem('apontamentos')) || [];
        const dadosHoje = dados.filter(d => d.data === hoje);

        if (dadosHoje.length === 0) {
            grid.innerHTML = `<p class="text-slate-500 col-span-full text-center py-20 bg-white rounded-xl shadow">Nenhum apontamento recebido hoje (${hoje}).</p>`;
        } else {
            grid.innerHTML = '';
            // Ordena por hora de envio
            dadosHoje.sort((a,b) => a.hora.localeCompare(b.hora));

            dadosHoje.forEach(item => {
                const corBorda = item.tipo === 'Montagem' ? 'border-blue-500' : 'border-orange-500';
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-lg border-t-4 ${corBorda} hover:shadow-2xl transition cursor-pointer" onclick="abrirDetalhes(${item.id})">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-lg text-slate-900 leading-tight">${item.encarregado}</h3>
                            <
