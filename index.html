<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apontamento de Andaimes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">
    
    <div>
        <div class="flex justify-center mb-6 mt-2">
            <img src="Logo.png" alt="Logo da Empresa" class="h-20 object-contain">
        </div>

        <h1 class="text-xl font-bold text-slate-800 mb-1 text-center">Portal do Encarregado</h1>
        <p class="text-xs text-slate-500 text-center mb-6">Gestão e Apontamento de Andaimes</p>
        
        <!-- TELA 1: SELEÇÃO DE ENCARREGADO -->
        <div id="telaSelecao" class="bg-white p-5 rounded-xl shadow-md space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Selecione o seu Nome:</label>
                <select id="selectEncarregado" class="w-full p-3 border rounded-lg bg-white text-base">
                    <option value="" disabled selected>-- Toque para escolher --</option>
                </select>
            </div>
            <button onclick="entrarNoPortal()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Acessar Painel</button>
        </div>

        <!-- TELA 2: MENU PRINCIPAL (APÓS ESCOLHER O NOME) -->
        <div id="telaMenu" class="bg-white p-5 rounded-xl shadow-md space-y-4 hidden">
            <div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-center">
                <span class="text-xs text-blue-600 block">Encarregado Conectado:</span>
                <span id="labelNomeLogado" class="font-bold text-blue-900 text-lg"></span>
                <button onclick="trocarEncarregado()" class="text-xs text-slate-500 underline block mx-auto mt-1">Alterar nome</button>
            </div>

            <button onclick="abrirFormularioNovo()" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold hover:bg-emerald-700 transition flex items-center justify-center gap-2 shadow">
                ➕ Cadastrar Novo Apontamento
            </button>

            <button onclick="abrirMeusApontamentos()" class="w-full bg-slate-700 text-white p-4 rounded-xl font-bold hover:bg-slate-800 transition flex items-center justify-center gap-2 shadow">
                📋 Verificar Meus Apontamentos
            </button>
        </div>

        <!-- TELA 3: FORMULÁRIO DE APONTAMENTO (COM NOME FIXO) -->
        <div id="telaFormulario" class="space-y-4 hidden">
            <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border">
                <h2 id="tituloForm" class="font-bold text-slate-800 text-sm">Novo Apontamento</h2>
                <button onclick="voltarParaMenu()" class="text-xs bg-slate-200 px-3 py-1 rounded font-semibold text-slate-700">← Voltar ao Menu</button>
            </div>

            <form id="formApontamento" class="bg-white p-4 rounded-xl shadow-md space-y-4">
                
                <!-- Nome Fixo -->
                <div class="bg-slate-50 border p-3 rounded-lg">
                    <label class="block text-xs font-semibold text-slate-500 uppercase">Encarregado Responsável</label>
                    <input type="text" id="encarregadoFixo" readonly class="w-full mt-1 font-bold text-slate-800 bg-transparent text-base outline-none cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Local de Trabalho</label>
                    <input type="text" id="local" required class="w-full mt-1 p-2 border rounded-lg" placeholder="Ex: Área 40 - Moega">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Tipo de Atividade</label>
                    <select id="tipo" class="w-full mt-1 p-2 border rounded-lg bg-white">
                        <option value="Montagem">Montagem</option>
                        <option value="Desmontagem">Desmontagem</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">Atividade</label>
                    <select id="atividadeSelect" class="w-full mt-1 p-2 border rounded-lg bg-white">
                        <option value="" disabled selected>Selecione a atividade</option>
                        <option value="manual" class="font-bold text-blue-600">+ Digitar outra atividade...</option>
                    </select>
                    <input type="text" id="atividadeManual" class="w-full mt-2 p-2 border rounded-lg hidden" placeholder="Descreva a atividade...">
                </div>

                <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2 rounded-lg border">
                    <div>
                        <label class="block text-xs font-medium text-slate-700">Pessoas Total</label>
                        <input type="number" id="pessoas" value="0" min="0" class="w-full mt-1 p-2 border rounded-lg text-center bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700">Faltas</label>
                        <input type="number" id="faltas" value="0" min="0" class="w-full mt-1 p-2 border rounded-lg text-center bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700">Folgas/CT</label>
                        <input type="number" id="folgas" value="0" min="0" class="w-full mt-1 p-2 border rounded-lg text-center bg-white">
                    </div>
                </div>

                <div class="border p-3 rounded-lg bg-slate-50 space-y-3">
                    <label class="block text-sm font-bold text-slate-700">Quantidade de Materiais Utilizados</label>
                    <p class="text-xs text-slate-500">Insira a quantidade usada para cada item necessário:</p>
                    <div id="containerGradeMateriais" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-700">Foto ANTES</label>
                        <input type="file" id="fotoAntes" accept="image/*" capture="environment" class="w-full mt-1 text-xs border p-1 rounded bg-white text-slate-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700">Foto DEPOIS</label>
                        <input type="file" id="fotoDepois" accept="image/*" capture="environment" class="w-full mt-1 text-xs border p-1 rounded bg-white text-slate-600">
                    </div>
                </div>

                <button type="submit" id="btnEnviar" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition duration-150">Salvar Apontamento</button>
            </form>
        </div>

        <!-- TELA 4: LISTA DOS APONTAMENTOS DO PRÓPRIO ENCARREGADO -->
        <div id="telaLista" class="space-y-3 hidden">
            <div class="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm border">
                <h2 class="font-bold text-slate-800 text-sm">Meus Apontamentos Anteriores</h2>
                <button onclick="voltarParaMenu()" class="text-xs bg-slate-200 px-3 py-1 rounded font-semibold text-slate-700">← Voltar ao Menu</button>
            </div>
            <div id="containerMeusApontamentos" class="space-y-3"></div>
        </div>

    </div>

    <div class="mt-8 text-center">
        <a href="painel.html" class="text-slate-400 text-xs hover:underline">Acesso Gestor (Notebook)</a>
    </div>

    <script>
        const encarregados = [
            "Cleber Sacramento Costa", "Edgenilson Reis dos Santos", "Denivaldo de Jesus Costa",
            "Ernande da Silva Bizerra", "Geciclei de Jesus Correa Marcena", "Giles da Silva",
            "Juzuel Coelho dos Santos", "Nadson Pinheiro", "Pedro Marcio Barbosa da Silva",
            "Leoncio Martins da Silva Filho", "Luis Carlos de Sousa Nascimento", "Adriano Santos de Pinho",
            "Osmar Santos de Santana", "Manoel Luiz Silva Maciel", "Raimundo Costa Araujo",
            "Rogerio da Silva Sousa", "Antonio Tiago de Souza Conceicao",
            "Benedito Junior dos Santos Pinheiro", "Flavio Bispo dos Santos",
            "Jose Carlos Assuncao Teles", "Andrewaldo Santos Cruz"
        ];

        const atividades = [
            "Finalização da Escadas", "Montagem da CWA 297", "Montagem da Plataforma da CWP 004",
            "Montagem da Plataforma da CWP 003", "Apoio Geral Noturno", "Apoio a Tubulação",
            "Montagem de Andaime para Montagem dos Contraventamentos entre as Filas",
            "Montagem de andaime para montagem da Plataforma 2.2",
            "Andaime para Pré Montagem do Silo Inferior 03 @ 04 - Montagem das Chapas Internas de Desgastes",
            "Andaime para Pré Montagem do Silo Intermediário 04, 06, 08, 09, 11 e 13 - Desmontagem dos Dispositivos de Içamento",
            "Andaime para Pré Montagem do Silo Intermediário 08 e 09 - Desmontagem dos Dispositivos de Içamento",
            "Andaime para Atendimento a montagem Eletromecânica das TRs",
            "Montagem de Andaime no Interno e Externo dos Silos - 06, 07 e 09",
            "Montagem de Andaime nas Peneiras - EL.302 e 306",
            "Andaime para Infra Elétrica de Iluminação", "Adequação de Andaimes - Cable Rack",
            "Apoio Geral a Elétrica", "Adequação de Andaimes no Fechamento de Leitos com Cable Rack",
            "Montagem de Andaime - Cable Rack"
        ];

        const catalogoMateriais = [
            "Tubo 0,50m", "Tubo 0,75m", "Tubo 1,00m", "Tubo 1,25m", "Tubo 1,50m",
            "Tubo 1,75m", "Tubo 2,00m", "Tubo 2,25m", "Tubo 2,50m", "Tubo 2,75m",
            "Tubo 3,00m", "Tubo 3,25m", "Tubo 3,50m", "Tubo 3,75m", "Tubo 4,00m",
            "Tubo 4,25m", "Tubo 4,50m", "Tubo 4,75m", "Tubo 5,00m", "Tubo 5,25m",
            "Tubo 5,50m", "Tubo 5,75m", "Tubo 6,00m",
            "Braçadeira Fixa", "Braçadeira Giratória", "Luva de Emenda", 
            "Sapata Ajustável", "Prancha Metálica", "Escada Metálica"
        ];

        // Populando selects globais
        const selectEncarregado = document.getElementById('selectEncarregado');
        encarregados.forEach(nome => selectEncarregado.add(new Option(nome, nome)));

        const selectAtividade = document.getElementById('atividadeSelect');
        atividades.forEach(ativ => selectAtividade.add(new Option(ativ, ativ), selectAtividade.options[selectAtividade.options.length - 1]));

        const containerGrade = document.getElementById('containerGradeMateriais');
        catalogoMateriais.forEach(mat => {
            containerGrade.innerHTML += `
                <div class="flex justify-between items-center bg-white p-2 border rounded-lg text-xs">
                    <span class="font-medium text-slate-700 w-3/5">${mat}</span>
                    <input type="number" min="0" value="0" data-material="${mat}" class="input-qtd w-2/5 p-1 border rounded text-center bg-slate-50 font-bold">
                </div>
            `;
        });

        const inputManual = document.getElementById('atividadeManual');
        selectAtividade.addEventListener('change', function() {
            if (this.value === 'manual') {
                inputManual.classList.remove('hidden');
                inputManual.required = true;
            } else {
                inputManual.classList.add('hidden');
                inputManual.required = false;
                inputManual.value = '';
            }
        });

        let idEdicaoAtivo = null;
        let fotoAntesSalva = null;
        let fotoDepoisSalva = null;

        // Verifica se já estava logado na memória do celular
        const encarregadoSalvo = localStorage.getItem('encarregadoLogado');
        if (encarregadoSalvo) {
            mostrarMenu(encarregadoSalvo);
        }

        function entrarNoPortal() {
            const nome = selectEncarregado.value;
            if (!nome) return alert('Selecione o seu nome.');
            localStorage.setItem('encarregadoLogado', nome);
            mostrarMenu(nome);
        }

        function mostrarMenu(nome) {
            document.getElementById('labelNomeLogado').innerText = nome;
            document.getElementById('telaSelecao').classList.add('hidden');
            document.getElementById('telaFormulario').classList.add('hidden');
            document.getElementById('telaLista').classList.add('hidden');
            document.getElementById('telaMenu').classList.remove('hidden');
        }

        function trocarEncarregado() {
            localStorage.removeItem('encarregadoLogado');
            document.getElementById('telaMenu').classList.add('hidden');
            document.getElementById('telaSelecao').classList.remove('hidden');
            selectEncarregado.value = "";
        }

        function voltarParaMenu() {
            const nome = localStorage.getItem('encarregadoLogado');
            mostrarMenu(nome);
        }

        function abrirFormularioNovo() {
            idEdicaoAtivo = null;
            fotoAntesSalva = null;
            fotoDepoisSalva = null;
            document.getElementById('tituloForm').innerText = "Novo Apontamento";
            document.getElementById('formApontamento').reset();
            document.getElementById('atividadeManual').classList.add('hidden');
            document.querySelectorAll('.input-qtd').forEach(i => i.value = 0);
            
            document.getElementById('encarregadoFixo').value = localStorage.getItem('encarregadoLogado');
            
            document.getElementById('telaMenu').classList.add('hidden');
            document.getElementById('telaFormulario').classList.remove('hidden');
        }

        function abrirMeusApontamentos() {
            document.getElementById('telaMenu').classList.add('hidden');
            document.getElementById('telaLista').classList.remove('hidden');

            const meuNome = localStorage.getItem('encarregadoLogado');
            const todos = JSON.parse(localStorage.getItem('apontamentos')) || [];
            const meus = todos.filter(d => d.encarregado === meuNome);
            const container = document.getElementById('containerMeusApontamentos');

            if (meus.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-slate-500 text-sm">Você ainda não enviou nenhum apontamento.</div>`;
                return;
            }

            container.innerHTML = '';
            meus.sort((a,b) => b.id - a.id);

            meus.forEach(item => {
                // Regra das 9 horas
                const tempoDecorridoHoras = (Date.now() - item.id) / (1000 * 60 * 60);
                const podeEditar = tempoDecorridoHoras <= 9;

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-md border-l-4 ${item.tipo === 'Montagem' ? 'border-blue-500' : 'border-orange-500'} space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold">${item.data} - ${item.hora || ''}</span>
                                <h3 class="font-bold text-slate-900 text-sm mt-1">${item.atividade}</h3>
                            </div>
                            <span class="text-xs px-2 py-0.5 rounded font-semibold ${item.tipo === 'Montagem' ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'}">${item.tipo}</span>
                        </div>
                        <p class="text-xs text-slate-500"><strong>Local:</strong> ${item.local}</p>
                        <div class="flex justify-between items-center pt-2 border-t text-xs">
                            <span class="text-slate-600">Efetivo: <strong>${item.pessoas}</strong> | Faltas: <strong>${item.faltas}</strong></span>
                            ${podeEditar ? `<button onclick="carregarParaEdicao(${item.id})" class="bg-amber-500 text-white px-3 py-1 rounded font-semibold hover:bg-amber-600 transition">Editar</button>` : `<span class="text-slate-400 italic">Prazo encerrado (>9h)</span>`}
                        </div>
                    </div>
                `;
            });
        }

        function carregarParaEdicao(id) {
            idEdicaoAtivo = id;
            document.getElementById('tituloForm').innerText = "Editar Apontamento";
            document.getElementById('formApontamento').reset();
            document.getElementById('atividadeManual').classList.add('hidden');
            document.querySelectorAll('.input-qtd').forEach(i => i.value = 0);

            document.getElementById('encarregadoFixo').value = localStorage.getItem('encarregadoLogado');

            const dados = JSON.parse(localStorage.getItem('apontamentos')) || [];
            const item = dados.find(d => d.id == id);
            if (!item) return;

            document.getElementById('local').value = item.local;
            document.getElementById('tipo').value = item.tipo;
            document.getElementById('pessoas').value = item.pessoas;
            document.getElementById('faltas').value = item.faltas;
            document.getElementById('folgas').value = item.folgas;

            if (atividades.includes(item.atividade)) {
                selectAtividade.value = item.atividade;
            } else {
                selectAtividade.value = 'manual';
                inputManual.classList.remove('hidden');
                inputManual.value = item.atividade;
            }

            if (item.materiaisLista) {
                const inputs = document.querySelectorAll('.input-qtd');
                inputs.forEach(inp => {
                    const matNome = inp.getAttribute('data-material');
                    const enc = item.materiaisLista.find(m => m.nome === matNome);
                    if (enc) inp.value = enc.quantidade;
                });
            }

            fotoAntesSalva = item.fotoAntes;
            fotoDepoisSalva = item.fotoDepois;

            document.getElementById('telaLista').classList.add('hidden');
            document.getElementById('telaFormulario').classList.remove('hidden');
        }

        function processarFoto(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 800;
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        document.getElementById('formApontamento').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('.input-qtd');
            let materiaisPreenchidos = [];
            
            inputs.forEach(input => {
                const qtd = parseInt(input.value) || 0;
                if (qtd > 0) {
                    materiaisPreenchidos.push({
                        nome: input.getAttribute('data-material'),
                        quantidade: qtd
                    });
                }
            });

            if (materiaisPreenchidos.length === 0) {
                return alert('Informe a quantidade de pelo menos um material utilizado.');
            }

            const btn = document.getElementById('btnEnviar');
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            let atividadeFinal = selectAtividade.value;
            if (atividadeFinal === 'manual') atividadeFinal = inputManual.value;

            const novaFotoAntes = await processarFoto(document.getElementById('fotoAntes').files[0]);
            const novaFotoDepois = await processarFoto(document.getElementById('fotoDepois').files[0]);

            let dadosSalvos = JSON.parse(localStorage.getItem('apontamentos')) || [];
            const encarregadoLogado = localStorage.getItem('encarregadoLogado');

            if (idEdicaoAtivo) {
                dadosSalvos = dadosSalvos.map(d => {
                    if (d.id == idEdicaoAtivo) {
                        return {
                            ...d,
                            local: document.getElementById('local').value,
                            tipo: document.getElementById('tipo').value,
                            atividade: atividadeFinal,
                            pessoas: document.getElementById('pessoas').value,
                            faltas: document.getElementById('faltas').value,
                            folgas: document.getElementById('folgas').value,
                            materiaisLista: materiaisPreenchidos,
                            fotoAntes: novaFotoAntes || fotoAntesSalva,
                            fotoDepois: novaFotoDepois || fotoDepoisSalva
                        };
                    }
                    return d;
                });
                alert('Apontamento atualizado com sucesso!');
            } else {
                const dataIso = new Date().toISOString().split('T')[0];
                const novoDado = {
                    id: Date.now(),
                    encarregado: encarregadoLogado,
                    local: document.getElementById('local').value,
                    tipo: document.getElementById('tipo').value,
                    atividade: atividadeFinal,
                    pessoas: document.getElementById('pessoas').value,
                    faltas: document.getElementById('faltas').value,
                    folgas: document.getElementById('folgas').value,
                    materiaisLista: materiaisPreenchidos,
                    fotoAntes: novaFotoAntes,
                    fotoDepois: novaFotoDepois,
                    dataIso: dataIso,
                    data: new Date().toLocaleDateString('pt-BR'),
                    hora: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})
                };
                dadosSalvos.push(novoDado);
                alert('Apontamento enviado com sucesso!');
            }

            try {
                localStorage.setItem('apontamentos', JSON.stringify(dadosSalvos));
                voltarParaMenu();
            } catch (err) {
                alert('Erro: Memória do navegador cheia!');
            }

            btn.innerText = 'Salvar Apontamento';
            btn.disabled = false;
        });
    </script>
</body>
</html>
