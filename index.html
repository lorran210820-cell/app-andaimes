<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apontamento de Andaimes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-4 max-w-md mx-auto">
    
    <div class="flex justify-center mb-6 mt-2">
        <img src="Logo.png" alt="Logo da Empresa" class="h-20 object-contain">
    </div>

    <h1 class="text-xl font-bold text-slate-800 mb-4 text-center">Apontamento Diário</h1>
    
    <form id="formApontamento" class="bg-white p-4 rounded-xl shadow-md space-y-4">
        
        <div>
            <label class="block text-sm font-medium text-slate-700">Nome do Encarregado</label>
            <select id="encarregado" required class="w-full mt-1 p-2 border rounded-lg bg-white">
                <option value="" disabled selected>Selecione seu nome</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Local de Trabalho</label>
            <input type="text" id="local" required class="w-full mt-1 p-2 border rounded-lg" placeholder="Ex: Área 40 - Moega">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Tipo de Atividade</label>
            <select id="tipo" class="w-full mt-1 p-2 border rounded-lg bg-white">
                <option value="Montagem">Montagem</option>
                <option value="Desmontagem">Desmontagem</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Atividade</label>
            <select id="atividadeSelect" class="w-full mt-1 p-2 border rounded-lg bg-white">
                <option value="" disabled selected>Selecione a atividade</option>
                <option value="manual" class="font-bold text-blue-600">+ Digitar outra atividade...</option>
            </select>
            <input type="text" id="atividadeManual" class="w-full mt-2 p-2 border rounded-lg hidden" placeholder="Descreva a atividade...">
        </div>

        <div class="grid grid-cols-3 gap-2 bg-slate-50 p-2 rounded-lg border">
            <div>
                <label class="block text-xs font-medium text-slate-700">Pessoas Total</label>
                <input type="number" id="pessoas" value="0" min="0" class="w-full mt-1 p-2 border rounded-lg text-center bg-white">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700">Faltas</label>
                <input type="number" id="faltas" value="0" min="0" class="w-full mt-1 p-2 border rounded-lg text-center bg-white">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700">Folgas/CT</label>
                <input type="number" id="folgas" value="0" min="0" class="w-full mt-1 p-2 border rounded-lg text-center bg-white">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Materiais Principais (Qtd)</label>
            <textarea id="materiais" rows="3" class="w-full mt-1 p-2 border rounded-lg" placeholder="Ex: Tubo 6m: 50, Abrac. Fixa: 100"></textarea>
        </div>

        <!-- Adicionado um aviso (opcional) de que a foto pode demorar 1 segundinho para comprimir -->
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-xs font-medium text-slate-700">Foto ANTES</label>
                <input type="file" id="fotoAntes" accept="image/*" capture="environment" class="w-full mt-1 text-xs border p-1 rounded bg-white text-slate-600">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700">Foto DEPOIS</label>
                <input type="file" id="fotoDepois" accept="image/*" capture="environment" class="w-full mt-1 text-xs border p-1 rounded bg-white text-slate-600">
            </div>
        </div>

        <button type="submit" id="btnEnviar" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition duration-150">Enviar Apontamento</button>
    </form>

    <script>
        const encarregados = [
            "Cleber Sacramento Costa", "Edgenilson Reis dos Santos", "Denivaldo de Jesus Costa",
            "Ernande da Silva Bizerra", "Geciclei de Jesus Correa Marcena", "Giles da Silva",
            "Juzuel Coelho dos Santos", "Nadson Pinheiro", "Pedro Marcio Barbosa da Silva",
            "Leoncio Martins da Silva Filho", "Luis Carlos de Sousa Nascimento", "Adriano Santos de Pinho",
            "Osmar Santos de Santana", "Manoel Luiz Silva Maciel", "Raimundo Costa Araujo",
            "Rogerio da Silva Sousa", "Antonio Tiago de Souza Conceicao",
            "Benedito Junior dos Santos Pinheiro", "Flavio Bispo dos Santos",
            "Jose Carlos Assuncao Teles", "Andrewaldo Santos Cruz"
        ];

        const atividades = [
            "Finalização da Escadas", "Montagem da CWA 297", "Montagem da Plataforma da CWP 004",
            "Montagem da Plataforma da CWP 003", "Apoio Geral Noturno", "Apoio a Tubulação",
            "Montagem de Andaime para Montagem dos Contraventamentos entre as Filas",
            "Montagem de andaime para montagem da Plataforma 2.2",
            "Andaime para Pré Montagem do Silo Inferior 03 @ 04 - Montagem das Chapas Internas de Desgastes",
            "Andaime para Pré Montagem do Silo Intermediário 04, 06, 08, 09, 11 e 13 - Desmontagem dos Dispositivos de Içamento",
            "Andaime para Pré Montagem do Silo Intermediário 08 e 09 - Desmontagem dos Dispositivos de Içamento",
            "Andaime para Atendimento a montagem Eletromecânica das TRs",
            "Montagem de Andaime no Interno e Externo dos Silos - 06, 07 e 09",
            "Montagem de Andaime nas Peneiras - EL.302 e 306",
            "Andaime para Infra Elétrica de Iluminação", "Adequação de Andaimes - Cable Rack",
            "Apoio Geral a Elétrica", "Adequação de Andaimes no Fechamento de Leitos com Cable Rack",
            "Montagem de Andaime - Cable Rack"
        ];

        const selectEncarregado = document.getElementById('encarregado');
        encarregados.forEach(nome => selectEncarregado.add(new Option(nome, nome)));

        const selectAtividade = document.getElementById('atividadeSelect');
        atividades.forEach(ativ => selectAtividade.add(new Option(ativ, ativ), selectAtividade.options[selectAtividade.options.length - 1]));

        const inputManual = document.getElementById('atividadeManual');
        selectAtividade.addEventListener('change', function() {
            if (this.value === 'manual') {
                inputManual.classList.remove('hidden');
                inputManual.required = true;
            } else {
                inputManual.classList.add('hidden');
                inputManual.required = false;
                inputManual.value = '';
            }
        });

        // Função mágica para reduzir a foto para não travar o teste no GitHub Pages
        function processarFoto(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 800; // Define largura máxima da foto
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); // Qualidade de 60%
                    };
                };
            });
        }

        // Alterado para 'async' para esperar a foto ser processada
        document.getElementById('formApontamento').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviar');
            btn.innerText = 'Processando e Enviando...';
            btn.classList.add('opacity-70');
            btn.disabled = true;

            let atividadeFinal = selectAtividade.value;
            if (atividadeFinal === 'manual') atividadeFinal = inputManual.value;

            const dataIso = new Date().toISOString().split('T')[0];

            // Pega os arquivos de foto se tiverem sido selecionados
            const fotoAntes = await processarFoto(document.getElementById('fotoAntes').files[0]);
            const fotoDepois = await processarFoto(document.getElementById('fotoDepois').files[0]);

            const novoDado = {
                id: Date.now(),
                encarregado: selectEncarregado.value,
                local: document.getElementById('local').value,
                tipo: document.getElementById('tipo').value,
                atividade: atividadeFinal,
                pessoas: document.getElementById('pessoas').value,
                faltas: document.getElementById('faltas').value,
                folgas: document.getElementById('folgas').value,
                materiais: document.getElementById('materiais').value,
                fotoAntes: fotoAntes,
                fotoDepois: fotoDepois,
                dataIso: dataIso,
                data: new Date().toLocaleDateString('pt-BR'),
                hora: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})
            };

            let dadosSalvos = JSON.parse(localStorage.getItem('apontamentos')) || [];
            dadosSalvos = dadosSalvos.filter(d => d.encarregado !== novoDado.encarregado || d.dataIso !== dataIso);
            dadosSalvos.push(novoDado);
            
            try {
                localStorage.setItem('apontamentos', JSON.stringify(dadosSalvos));
                alert('Apontamento enviado com sucesso!');
                this.reset();
                inputManual.classList.add('hidden');
            } catch (err) {
                alert('Erro: Memória do navegador cheia! Limpe os apontamentos antigos ou teste com fotos menores.');
            }

            btn.innerText = 'Enviar Apontamento';
            btn.classList.remove('opacity-70');
            btn.disabled = false;
        });
    </script>
</body>
</html>
